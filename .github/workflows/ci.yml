name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the API and frontend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health && curl -fsSI http://localhost:3000; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Seed data is served
        run: |
          count=$(curl -fsS http://localhost:8000/leads | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "leads: $count"
          test "$count" -ge 5
      - name: Tear down
        if: always()
        run: docker compose down -v
